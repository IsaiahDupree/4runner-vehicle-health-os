[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vhos-tooling"
version = "0.1.0"
description = "Contract validation, deterministic capture simulation, and replay tooling for 4Runner Vehicle Health OS"
requires-python = ">=3.12"
dependencies = [
  "jsonschema>=4.23,<5"
]

[project.optional-dependencies]
test = [
  "pytest>=8,<10"
]

[project.scripts]
vhos = "vhos.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["../tests"]
