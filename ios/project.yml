name: VehicleHealthOS
options:
  bundleIdPrefix: com.isaiahdupree
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  VHOSCore:
    path: Core
targets:
  VehicleHealthOS:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: VHOSCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.isaiahdupree.VehicleHealthOS
        PRODUCT_NAME: Vehicle Health OS
        SWIFT_VERSION: 6.0
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: Y4HDXFWXUV
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: App/VehicleHealthOSCommissioning.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: App/VehicleHealthOS.entitlements
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Vehicle Health OS
        CFBundleShortVersionString: "0.3.19"
        CFBundleVersion: "26"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSBluetoothAlwaysUsageDescription: Vehicle Health OS uses Bluetooth to receive vehicle telemetry and manage the local gateway.
        NSLocalNetworkUsageDescription: Vehicle Health OS uses the gateway's private Wi-Fi network for verified firmware updates and evidence transfer.
        UIBackgroundModes:
          - bluetooth-central
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
schemes:
  VehicleHealthOS:
    build:
      targets:
        VehicleHealthOS: all
    run:
      config: Debug
    archive:
      config: Release
