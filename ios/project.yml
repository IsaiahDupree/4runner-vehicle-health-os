name: VehicleHealthOS
options:
  bundleIdPrefix: com.isaiahdupree
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  VHOSCore:
    path: Core
targets:
  VehicleHealthOS:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: VHOSCore
    settings:
      base:
        CURRENT_PROJECT_VERSION: 35
        MARKETING_VERSION: "0.3.27"
        PRODUCT_BUNDLE_IDENTIFIER: com.isaiahdupree.VehicleHealthOS
        PRODUCT_NAME: Vehicle Health OS
        SWIFT_VERSION: 6.0
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: Y4HDXFWXUV
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: App/VehicleHealthOSCommissioning.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: App/VehicleHealthOS.entitlements
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Vehicle Health OS
        CFBundleShortVersionString: "0.3.27"
        CFBundleVersion: "35"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSBluetoothAlwaysUsageDescription: Vehicle Health OS uses Bluetooth to receive vehicle telemetry and manage the local gateway.
        NSLocalNetworkUsageDescription: Vehicle Health OS uses private Wi-Fi for verified gateway updates, evidence transfer, and the Rev G lighting controller.
        UIBackgroundModes:
          - bluetooth-central
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  VehicleHealthOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AppTests
    dependencies:
      - target: VehicleHealthOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.isaiahdupree.VehicleHealthOSTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 6.0
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Vehicle Health OS.app/Vehicle Health OS"
        BUNDLE_LOADER: "$(TEST_HOST)"
  4RunnerLighting:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
    dependencies:
      - package: VHOSCore
    settings:
      base:
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.isaiahdupree.4RunnerLighting
        PRODUCT_NAME: 4Runner Lighting
        SWIFT_VERSION: 6.0
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) LIGHTING_STUDIO"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: Y4HDXFWXUV
        CODE_SIGN_ENTITLEMENTS: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: LightingAppIcon
        SUPPORTS_MACCATALYST: NO
    info:
      path: Lighting/Info.plist
      properties:
        CFBundleDisplayName: 4Runner Lighting
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSBluetoothAlwaysUsageDescription: 4Runner Lighting uses Bluetooth to receive verified CAN telemetry from your existing VHOS gateway.
        NSLocalNetworkUsageDescription: 4Runner Lighting controls your ESP32 RGBW controller over its private Wi-Fi network and reads its supply-voltage sensor.
        UIBackgroundModes:
          - bluetooth-central
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
  4RunnerLightingUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - LightingUITests
    dependencies:
      - target: 4RunnerLighting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.isaiahdupree.4RunnerLightingUITests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 6.0
schemes:
  VehicleHealthOS:
    build:
      targets:
        VehicleHealthOS: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - VehicleHealthOSTests
    archive:
      config: Release
  4RunnerLighting:
    build:
      targets:
        4RunnerLighting: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - 4RunnerLightingUITests
    archive:
      config: Release
