[env:vhos_revg_n16r2]
extends = env:esp32s3dev_16MB_opi
board_build.arduino.memory_type = qio_qspi
custom_usermods = vhos_revg
build_unflags = ${common.build_unflags} -std=gnu++11
build_flags = ${common.build_flags} ${esp32s3.build_flags}
  -std=gnu++17
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DWLED_RELEASE_NAME=\"VHOS_4RUNNER_REVG_N16R2\"
  -DWLED_AP_SSID=\"4Runner-Lighting\"
  -DLED_TYPES=44
  -DDATA_PINS=18,17,14,2
  -DPIXEL_COUNTS=1
  -DBTNPIN=-1
  -DIRPIN=-1
  -DRLYPIN=-1
  -DWLED_DISABLE_OTA
  -DWLED_DISABLE_MQTT
  -DWLED_DISABLE_ALEXA
  -DWLED_DISABLE_HUESYNC
  -DWLED_DISABLE_ESPNOW
  -DWLED_WATCHDOG_TIMEOUT=5
  -DWLED_DISABLE_2D
