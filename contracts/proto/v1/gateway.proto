syntax = "proto3";

package vhos.gateway.v1;

option java_multiple_files = true;
option java_package = "io.vhos.gateway.contract.v1";

enum MessageType {
  MESSAGE_TYPE_UNSPECIFIED = 0;
  HANDSHAKE = 1;
  RAW_CAN_FRAME = 2;
  DIAGNOSTIC_RESPONSE = 3;
  GATEWAY_HEALTH = 4;
  CAPTURE_MARKER = 5;
  ALLOWLISTED_DIAGNOSTIC_REQUEST = 6;
}

message Version {
  uint32 major = 1;
  uint32 minor = 2;
  uint32 patch = 3;
}

message Handshake {
  string gateway_id = 1;
  string hardware_revision = 2;
  string firmware_build_id = 3;
  Version protocol_version = 4;
  uint32 max_frame_bytes = 5;
  repeated MessageType supported_message_types = 6;
  string active_config_id = 7;
  string active_config_version = 8;
  bool listen_only = 9;
}

message RawCanFrame {
  string capture_id = 1;
  uint32 bus_index = 2;
  uint32 arbitration_id = 3;
  bytes data = 4;
  bool extended_id = 5;
  bool remote_frame = 6;
  uint32 twai_alert_bits = 7;
}

message DiagnosticResponse {
  string capture_id = 1;
  string allowlist_entry_id = 2;
  string ecu_id = 3;
  bytes response_payload = 4;
  uint32 request_sequence = 5;
}

message GatewayHealth {
  string gateway_id = 1;
  uint64 uptime_ms = 2;
  string reset_reason = 3;
  uint64 received_frames = 4;
  uint64 dropped_frames = 5;
  uint64 bus_error_count = 6;
  uint64 bus_off_count = 7;
  uint64 reconnect_count = 8;
  uint64 storage_free_bytes = 9;
  uint32 queue_depth = 10;
  bool listen_only = 11;
}

message CaptureMarker {
  string capture_id = 1;
  string marker_id = 2;
  string label = 3;
  string operator_note = 4;
}

// Raw request bytes are intentionally absent. Firmware resolves the referenced
// allowlist entry and independently applies rate, motion, and experiment policy.
message AllowlistedDiagnosticRequest {
  string request_id = 1;
  string allowlist_entry_id = 2;
  string experiment_id = 3;
}
